name: Sync README from jSite

# No schedule on purpose: GitHub disables scheduled workflows in a public repo after 60 days
# without activity, and a disabled workflow ignores repository_dispatch too. jSite dispatches
# readme_updated whenever its README changes; run this manually to force a sync.
on:
  repository_dispatch:
    types:
      - readme_updated
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download README from source repo
        env:
          SOURCE_OWNER: hizkiajuan
          SOURCE_REPO: jsite
          SOURCE_REF: main
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.JSITE_READS_PROFILE }}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${SOURCE_OWNER}/${SOURCE_REPO}/contents/README.md?ref=${SOURCE_REF}" \
            -o README.md

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync README from source repo"
          git push
