name: Sync README from jsite

on:
  workflow_dispatch:
  schedule:
    - cron: "27 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download README from source repo
        env:
          SOURCE_OWNER: hizkiajuan
          SOURCE_REPO: jsite
          SOURCE_REF: main
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.SOURCE_REPO_READ_TOKEN }}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${SOURCE_OWNER}/${SOURCE_REPO}/contents/README.md?ref=${SOURCE_REF}" \
            -o README.md

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync README from source repo"
          git push
